# SMS — the whole stack: PostgreSQL, the app, and Caddy for HTTPS.
#
# First setup and updates: see docker.env.example.
#
# Only Caddy publishes a port (443). The database and the app are reachable
# solely on the internal compose network. Docker bypasses ufw for published
# ports, so never add `ports:` to db or app — use `docker compose exec db psql -U sms sms`.
#
# NEVER run `docker compose down -v`: it deletes the database, uploads, logs and
# the TLS certificates.
#
# Hardening note: `security_opt: no-new-privileges` is deliberately absent. On
# Ubuntu's 7.x kernels with Docker 29 and AppArmor it makes every exec in the
# container fail ("exec ...: operation not permitted"), even for plain binaries.
# Capabilities are dropped instead.

name: sms

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: sms
      POSTGRES_DB: sms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Nicosia
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql (not .../data).
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d sms"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb
    logging: *logging

  app:
    build:
      context: .
      args:
        # Baked in at build time. Test server only; leave empty in production.
        NEXT_PUBLIC_TEST_DATE: ${NEXT_PUBLIC_TEST_DATE:-}
    image: sms-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sms:${POSTGRES_PASSWORD}@db:5432/sms
      NEXTAUTH_URL: https://${SMS_DOMAIN:?set SMS_DOMAIN in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    volumes:
      - uploads:/data/uploads
      - logs:/data/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/el/login',{redirect:'manual'}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Runs as the unprivileged node user and needs no capabilities at all.
    cap_drop:
      - ALL
    logging: *logging

  caddy:
    build: ./ops/docker/caddy
    image: sms-caddy:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      SMS_DOMAIN: ${SMS_DOMAIN:?set SMS_DOMAIN in .env}
      TLS_MODE: ${TLS_MODE:-cloudflare}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    ports:
      - "${HTTPS_BIND:-0.0.0.0}:443:443"
    volumes:
      - caddy_data:/data     # certificates and ACME account
      - caddy_config:/config
    # Only the one capability it needs: binding port 443.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging: *logging

volumes:
  db:
  uploads:
  logs:
  caddy_data:
  caddy_config:
